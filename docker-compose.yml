services:
  db:
    image: pgvector/pgvector:pg16
    container_name: local-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./src/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: local-rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: local-rag-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:?API_KEY não definida. Exporte antes de subir o container.}
      PG_DSN: postgresql://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      CHAT_MODEL: ${CHAT_MODEL:-google/gemma-3-4b}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  worker:
    build: .
    container_name: local-rag-worker
    command: python worker.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      CHAT_MODEL: ${CHAT_MODEL:-google/gemma-3-4b}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  ollama-models:
